{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Détection du thème système — exécuté avant le CSS pour éviter le flash
    // de contenu clair/sombre (FOUC), même mécanisme que sur les pages authentifiées.
    (function () {
      var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <title>Nouveau mot de passe — StudyMed</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'qcm/img/favicon.svg' %}">
  <link href="{% static 'qcm/vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet">
  <style>
    svg.bi { display: inline-block; width: 1em; height: 1em; vertical-align: -0.125em; fill: currentColor; }
    body { background-color: #f8f9fa; }
    [data-bs-theme="dark"] body { background-color: #1a1d20; }
  </style>
</head>

<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="bi-heart-pulse" viewBox="0 0 16 16"><path d="m8 2.748-.717-.737C5.6.281 2.514.878 1.4 3.053.918 3.995.78 5.323 1.508 7H.43c-2.128-5.697 4.165-8.83 7.394-5.857q.09.083.176.171a3 3 0 0 1 .176-.17c3.23-2.974 9.522.159 7.394 5.856h-1.078c.728-1.677.59-3.005.108-3.947C13.486.878 10.4.28 8.717 2.01zM2.212 10h1.315C4.593 11.183 6.05 12.458 8 13.795c1.949-1.337 3.407-2.612 4.473-3.795h1.315c-1.265 1.566-3.14 3.25-5.788 5-2.648-1.75-4.523-3.434-5.788-5"/><path d="M10.464 3.314a.5.5 0 0 0-.945.049L7.921 8.956 6.464 5.314a.5.5 0 0 0-.88-.091L3.732 8H.5a.5.5 0 0 0 0 1H4a.5.5 0 0 0 .416-.223l1.473-2.209 1.647 4.118a.5.5 0 0 0 .945-.049l1.598-5.593 1.457 3.642A.5.5 0 0 0 12 9h3.5a.5.5 0 0 0 0-1h-3.162z"/></symbol>
  <symbol id="bi-check-circle-fill" viewBox="0 0 16 16"><path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/></symbol>
  <symbol id="bi-envelope-fill" viewBox="0 0 16 16"><path d="M.05 3.555A2 2 0 0 1 2 2h12a2 2 0 0 1 1.95 1.555L8 8.414zM0 4.697v7.104l5.803-3.558zM6.761 8.83l-6.57 4.027A2 2 0 0 0 2 14h12a2 2 0 0 0 1.808-1.144l-6.57-4.027L8 9.586zm3.436-.586L16 11.801V4.697z"/></symbol>
  <symbol id="bi-lock-fill" viewBox="0 0 16 16"><path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2m3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2"/></symbol>
</svg>
  <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card shadow-sm" style="width: 100%; max-width: 420px;">
      <div class="card-body p-4">
        <h1 class="h4 text-center fw-bold text-primary mb-1"><svg class="bi"><use href="#bi-heart-pulse"></use></svg> StudyMed</h1>
        <p class="text-center text-muted small mb-4">Nouveau mot de passe</p>

        {% if validlink %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_new_password1" class="form-label fw-semibold">Nouveau mot de passe</label>
            <input type="password" name="new_password1" id="id_new_password1" class="form-control" required
              autocomplete="new-password">
          </div>
          <div class="mb-4">
            <label for="id_new_password2" class="form-label fw-semibold">Confirmer le mot de passe</label>
            <input type="password" name="new_password2" id="id_new_password2" class="form-control" required
              autocomplete="new-password">
          </div>
          {% if form.errors %}
          <div class="alert alert-danger small py-2">{{ form.errors }}</div>
          {% endif %}
          <button type="submit" class="btn btn-primary w-100">Enregistrer le mot de passe</button>
        </form>
        {% else %}
        <div class="alert alert-danger">
          Le lien de réinitialisation est invalide ou a expiré (24h).
          <a href="/password_reset/" class="alert-link">Faire une nouvelle demande</a>.
        </div>
        {% endif %}
      </div>
    </div>
  </div>
</body>

</html>
